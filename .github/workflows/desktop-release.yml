name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  make:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos
          - os: windows-2025
            artifact: windows
          - os: ubuntu-24.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop lint
      - run: pnpm --filter desktop test
      - run: pnpm --filter desktop make
        env:
          REDSTONE_API_URL: https://redstone.citadel.red/api
      - uses: actions/upload-artifact@v4
        with:
          name: redstone-${{ matrix.artifact }}
          path: apps/desktop/out/make/**/*
          if-no-files-found: error

  release:
    needs: make
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: redstone-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          find release-assets -type f -exec gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber {} +
